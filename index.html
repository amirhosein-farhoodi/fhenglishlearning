<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Kept in sync with the chosen theme by applyTheme() in src/lib/storage.ts -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="FH Language Learning - learn English lesson by lesson with playful, interactive exercises. Pick a book, read a short lesson, then practise it." />
    <title>FH Language Learning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- One family only. Inter stands in for Udemy Sans: weights 300-700 as a
         single variable file. See design-system.md. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet" />
    <script>
      /* Light is the default; only a stored choice turns on dark. This runs
         before first paint so the page never flashes the wrong theme. The OS
         setting is deliberately ignored - see src/styles/global.css. */
      try {
        var saved = JSON.parse(localStorage.getItem('fhlanguagelearning:v1') || '{}')
        if (saved && saved.settings && saved.settings.theme === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = '#202230'
        }
      } catch (e) {
        /* private mode or corrupt value - fall through to light */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
