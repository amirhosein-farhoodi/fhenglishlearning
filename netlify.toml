[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: send every route to index.html so React Router handles it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints every filename under /assets, so those bytes can never go
# stale - cache them hard. index.html must stay uncached or a deploy would not
# reach anyone still holding the old one.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
